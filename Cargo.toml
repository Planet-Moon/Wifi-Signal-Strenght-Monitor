[package]
name = "wifi_signal_monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Using windows-sys for lightweight raw OS API bindings
windows-sys = { version = "0.52", features = ["Win32_NetworkManagement_WiFi", "Win32_Foundation"] }
